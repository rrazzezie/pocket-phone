
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a10">
<title>Pocket Phone</title>
<style>
:root {
  --bg:#090a10; --panel:#171923; --panel2:#222533;
  --text:#f5f5fa; --muted:#9da1b4; --accent:#9b8cff;
  --line:#303343; --pink:#fa86b7;
}
* { box-sizing:border-box; }
body {
  margin:0; background:#08090d; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100svh; display:grid; place-items:center;
}
button,input,textarea { font:inherit; }
button { cursor:pointer; color:inherit; }
.phone {
  width:min(100%,420px); height:min(880px,100svh);
  min-height:540px; position:relative; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column;
}
@media (min-width:500px) {
  body { padding:20px; }
  .phone {
    height:min(880px,94svh); min-height:600px;
    border:5px solid #30313a; border-radius:42px;
    box-shadow:0 25px 90px #000a;
  }
}
.status {
  height:35px; flex-shrink:0; display:flex; align-items:center;
  justify-content:space-between; padding:0 24px;
  font-size:12px; font-weight:700; z-index:3;
}
.status span:last-child { letter-spacing:2px; }
.screen {
  display:none; flex:1; min-height:0; overflow-y:auto;
  padding:12px 18px 20px;
  scrollbar-width:thin; scrollbar-color:#454557 transparent;
}
.screen.active { display:block; }
#lock {
  position:absolute; inset:0; z-index:10;
  background:linear-gradient(160deg,#302b51,#111321 52%,#090a10);
  display:flex; flex-direction:column; align-items:center;
  padding:65px 28px 28px; text-align:center;
}
#lock.hidden { display:none; }
.lock-date { color:#d1c9ff; font-size:14px; }
.lock-clock { font-size:68px; font-weight:200; letter-spacing:-3px; }
.lock-hint {
  background:#ffffff10; border:1px solid #ffffff20;
  border-radius:14px; padding:12px 15px; margin:20px 0;
  font-size:12px; color:#e0dcf6; line-height:1.6;
}
.dots { display:flex; justify-content:center; gap:13px; margin:18px; }
.dot { width:11px; height:11px; border:1px solid #d9d4f6; border-radius:50%; }
.dot.filled { background:#d9d4f6; }
.keypad {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:12px; width:min(280px,100%); margin:auto 0 12px;
}
.key {
  border:0; border-radius:50%; aspect-ratio:1; max-height:65px;
  background:#ffffff16; font-size:23px;
}
.key small { display:block; font-size:9px; color:#c5c0d9; }
.key:active,.app-icon:active { transform:scale(.94); }
#lockError { min-height:20px; color:#ffb0c6; font-size:12px; }
.home-top { display:flex; justify-content:space-between; align-items:center; }
.mini-label { color:var(--muted); font-size:12px; }
.greeting { font-size:27px; font-weight:750; margin:6px 0 18px; }
.widget {
  border-radius:23px; padding:17px; margin-bottom:15px;
  background:linear-gradient(135deg,#3b3861,#1d2035);
}
.widget-row { display:flex; justify-content:space-between; align-items:center; }
.temp { font-size:36px; font-weight:300; }
.widget p { margin:5px 0; color:#d4d2e8; font-size:12px; }
.app-grid {
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px 6px; padding:12px 0 18px;
}
.app-icon {
  min-width:0; display:flex; flex-direction:column;
  align-items:center; gap:7px; background:none; border:0;
  padding:0; transition:transform .12s;
}
.app-icon span:first-child {
  width:52px; height:52px; display:grid; place-items:center;
  border-radius:15px; font-size:25px;
  box-shadow:0 3px 8px #0003;
}
.app-icon span:last-child {
  font-size:10px; max-width:100%; overflow-wrap:anywhere;
}
.dock {
  display:flex; justify-content:space-around; gap:12px;
  margin-top:auto; padding:14px 12px;
  background:#ffffff0b; border-radius:23px;
}
.dock .app-icon span:last-child { display:none; }
.bottom-area { padding:0 15px 13px; }
.homebar {
  height:5px; width:110px; background:#f5f5fa;
  border-radius:10px; margin:9px auto 0;
}
.app-header {
  display:flex; align-items:center; gap:12px;
  position:sticky; top:-12px; padding:12px 0;
  background:var(--bg); z-index:2; margin-bottom:12px;
}
.back {
  border:0; background:var(--panel2); border-radius:12px;
  width:38px; height:38px; font-size:20px;
}
.app-title { font-size:21px; font-weight:750; }
.card {
  background:var(--panel); border:1px solid var(--line);
  border-radius:18px; padding:15px; margin-bottom:12px;
}
.muted { color:var(--muted); font-size:12px; }
.small { font-size:13px; }
.row { display:flex; align-items:center; gap:12px; }
.between { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.avatar {
  width:42px; height:42px; border-radius:50%;
  display:grid; place-items:center; background:#393653; flex-shrink:0;
}
.action {
  background:var(--accent); color:#151224; border:0;
  padding:10px 14px; border-radius:12px; font-weight:650;
}
.secondary {
  background:var(--panel2); color:var(--text);
  border:1px solid var(--line); padding:10px 13px;
  border-radius:12px;
}
.field,textarea {
  width:100%; border:1px solid var(--line);
  border-radius:12px; background:var(--panel);
  color:var(--text); padding:12px; outline:none;
}
textarea { resize:vertical; min-height:100px; }
.stack { display:flex; flex-direction:column; gap:10px; }
.item {
  display:flex; gap:12px; align-items:center; width:100%;
  text-align:left; padding:13px; border:0;
  border-radius:14px; background:var(--panel);
}
.item .grow { flex:1; min-width:0; }
.item p { margin:4px 0 0; }
.pill {
  border-radius:99px; padding:4px 9px;
  background:#9b8cff20; color:#c7bcff; font-size:11px;
}
.photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
.photo {
  aspect-ratio:1; display:grid; place-items:center;
  border:0; border-radius:9px; font-size:32px;
  background:linear-gradient(145deg,#45405f,#252a3c);
}
.post-image {
  min-height:155px; display:grid; place-items:center;
  border-radius:13px; font-size:58px;
  background:linear-gradient(135deg,#403c61,#272c43);
  margin:12px 0;
}
.note-line { padding:12px 0; border-bottom:1px solid var(--line); }
.big-number { font-size:29px; font-weight:700; }
a { color:#c4b9ff; }
.light-mode {
  --bg:#f2f2f8; --panel:#fff; --panel2:#e5e5f0;
  --text:#171722; --muted:#656579; --line:#d8d8e6;
}
.light-mode .app-header { background:var(--bg); }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status">
    <span id="statusTime">9:41</span>
    <span>● ▮▮▮ ▰</span>
  </div>

  <section id="lock">
    <div class="lock-date" id="lockDate">MONDAY, OCTOBER 26</div>
    <div class="lock-clock" id="lockClock">9:41</div>
    <div style="font-size:15px;margin-top:10px">A phone full of memories.</div>
    <div class="lock-hint">
      🔒 &nbsp; A little mystery<br>
      <b>Hint:</b> The date the story began. Enter it as MMDD.
    </div>
    <div class="muted">ENTER PASSCODE</div>
    <div class="dots" id="dots"></div>
    <div id="lockError"></div>
    <div class="keypad" id="keypad"></div>
    <div class="muted" style="margin-top:auto">FICTIONAL DEVICE · POCKET PHONE</div>
  </section>

  <main id="home" class="screen">
    <div class="home-top">
      <span class="mini-label" id="homeDate">MON, OCT 26</span>
      <button class="secondary" onclick="openApp('Settings')">⚙️</button>
    </div>
    <div class="greeting">Good evening.</div>
    <div class="widget">
      <div class="widget-row">
        <div>
          <div style="font-weight:700">Tasikmalaya</div>
          <p>Mostly cloudy · Fictional weather</p>
          <p>Feels like a long day.</p>
        </div>
        <div style="font-size:35px">☁️</div>
        <div class="temp">26°</div>
      </div>
    </div>
    <div class="app-grid" id="appGrid"></div>
    <div class="dock" id="dock"></div>
  </main>

  <main id="appScreen" class="screen"></main>
  <div class="bottom-area">
    <div class="homebar" id="homebar"></div>
  </div>
</div>

<script>
const PIN = "1026";

const apps = [
  {name:"Instagram",icon:"📸",color:"#8a386f"},
  {name:"LINE",icon:"💬",color:"#286f48"},
  {name:"YouTube",icon:"▶️",color:"#a83242"},
  {name:"Safari",icon:"🧭",color:"#305c93"},
  {name:"Weather",icon:"🌤️",color:"#345b8b"},
  {name:"Calendar",icon:"📅",color:"#873f4b"},
  {name:"Notes",icon:"📝",color:"#8b7434"},
  {name:"Gallery",icon:"🌄",color:"#5d477c"},
  {name:"Messages",icon:"✉️",color:"#267c62"},
  {name:"Music",icon:"🎵",color:"#8b3860"},
  {name:"Contacts",icon:"👤",color:"#4b6686"},
  {name:"Phone",icon:"📞",color:"#28714c"},
  {name:"Settings",icon:"⚙️",color:"#545a70"},
  {name:"Mail",icon:"📨",color:"#3c6796"},
  {name:"X",icon:"𝕏",color:"#292a31"},
  {name:"Bank",icon:"🏦",color:"#716042"}
];

let entered = "";
let currentApp = "";
let musicPlaying = false;
let lightMode = false;
let liked = false;
let wallpaperIndex = 0;
const $ = id => document.getElementById(id);

function clock() {
  const now = new Date();
  $("statusTime").textContent = now.toLocaleTimeString([], {
    hour:"2-digit",minute:"2-digit"
  });
  $("lockClock").textContent = now.toLocaleTimeString([], {
    hour:"2-digit",minute:"2-digit",hour12:false
  });
  $("lockDate").textContent = now.toLocaleDateString("en-US",{
    weekday:"long",month:"long",day:"numeric"
  }).toUpperCase();
  $("homeDate").textContent = now.toLocaleDateString("en-US",{
    weekday:"short",month:"short",day:"numeric"
  }).toUpperCase();
}
clock();
setInterval(clock,30000);

function makeButton(label,action,cls="secondary") {
  return `<button class="${cls}" onclick="${action}">${label}</button>`;
}
function iconButton(app) {
  return `<button class="app-icon" onclick="openApp('${app.name}')">
    <span style="background:${app.color}">${app.icon}</span>
    <span>${app.name}</span>
  </button>`;
}
$("keypad").innerHTML = [
  ["1",""],["2","ABC"],["3","DEF"],
  ["4","GHI"],["5","JKL"],["6","MNO"],
  ["7","PQRS"],["8","TUV"],["9","WXYZ"],
  ["",""],["0","+"],["⌫","DELETE"]
].map(([n,letters]) => n ?
  `<button class="key" onclick="${n==="⌫"?"erasePin()":`addPin('${n}')`}">
    ${n}<small>${letters}</small>
  </button>` :
  `<div></div>`).join("");

function drawDots() {
  $("dots").innerHTML = Array.from({length:4},(_,i)=>
    `<span class="dot ${i<entered.length?"filled":""}"></span>`
  ).join("");
}
function addPin(n) {
  if(entered.length>=4) return;
  entered += n;
  drawDots();
  if(entered.length===4) {
    if(entered===PIN) {
      $("lockError").textContent="Unlocked ✨";
      setTimeout(()=>{
        $("lock").classList.add("hidden");
        showScreen("home");
        entered="";
        drawDots();
      },250);
    } else {
      $("lockError").textContent="Not quite. Look for the date clue.";
      setTimeout(()=>{entered="";drawDots();},650);
    }
  }
}
function erasePin() {
  entered=entered.slice(0,-1);
  $("lockError").textContent="";
  drawDots();
}
function showScreen(id) {
  ["home","appScreen"].forEach(x=>$(x).classList.remove("active"));
  $(id).classList.add("active");
}
function goHome() {
  currentApp="";
  showScreen("home");
}
function back() { goHome(); }

$("appGrid").innerHTML=apps.map(iconButton).join("");
$("dock").innerHTML=[
  apps[10],apps[11],apps[8],apps[0]
].map(iconButton).join("");

function header(name) {
  return `<div class="app-header">
    <button class="back" onclick="back()">‹</button>
    <div class="app-title">${name}</div>
  </div>`;
}
function card(content) { return `<div class="card">${content}</div>`; }
function rowItem(icon,title,sub,action) {
  return `<button class="item" onclick="${action}">
    <span style="font-size:25px">${icon}</span>
    <span class="grow"><b>${title}</b><p class="muted">${sub}</p></span>
    <span>›</span>
  </button>`;
}

const chats = [
  ["Mika","Are you still awake?","23:41","🌙"],
  ["Unknown","Don't forget what happened on the 26th.","23:26","?"],
  ["Alex","I found something in the gallery.","22:08","🗝️"],
  ["Mom","Come home soon.","19:15","🏠"]
];
const mail = [
  ["Alex","Please read this when you're alone.","A strange thing happened today..."],
  ["Reminder","One thing you should remember","Check your notes. There's more than one clue."],
  ["Mika","Re: yesterday","You promised not to tell anyone."]
];
const photos = ["🌆","🌙","🌧️","🪞","🌷","🗝️","📷","🏙️","🖤"];
const videos = [
  ["A night to remember","Mika · 02:14"],
  ["Things I never said","Alex · 04:26"],
  ["October memories","Personal archive · 01:26"]
];

function openApp(name) {
  currentApp=name;
  showScreen("appScreen");
  renderApp();
}
function renderApp() {
  const s=$("appScreen");
  let html=header(currentApp);

  switch(currentApp) {
    case "Instagram":
      html+=card(`<div class="row"><div class="avatar">🌙</div>
        <div><b>mika.afterdark</b><div class="muted">Close friends</div></div></div>
        <div class="post-image">🌃</div>
        <b>mika.afterdark</b> Some nights stay with you forever.
        <p class="muted">October 26 · 2 comments</p>
        <button class="secondary" onclick="toggleLike()" id="likeBtn">${liked?"❤️ Liked":"♡ Like"}</button>
        <button class="secondary" onclick="toast('Comments are part of this fictional story.')">💬 Comment</button>
        <p class="muted">A locked memory is still a memory.</p>`);
      html+=card(`<b>Your feed</b><p class="muted">You're all caught up.</p>`);
      break;

    case "LINE":
      html+=`<p class="muted">CHATS · FICTIONAL CONVERSATIONS</p><div class="stack">`;
      chats.forEach((c,i)=>{
        html+=rowItem(c[3],c[0],c[1]+" · "+c[2],`openChat(${i})`);
      });
      html+=`</div>`;
      break;

    case "YouTube":
      html+=`<input class="field" id="videoSearch" placeholder="Search videos" oninput="filterVideos()">
      <div id="videoList" class="stack" style="margin-top:12px">`;
      videos.forEach((v,i)=>{
        html+=rowItem("▶️",v[0],v[1],`playVideo(${i})`);
      });
      html+=`</div><div id="videoPlayer"></div>`;
      break;

    case "Safari":
      html+=`<form onsubmit="searchWeb(event)" class="row">
        <input class="field" id="webQuery" placeholder="Search or enter website">
        <button class="action">Go</button></form>
        <div id="webResults" style="margin-top:15px">
        ${card("<b>Frequently visited</b><p class='muted'>Fictional pages from this phone</p>")}
        ${rowItem("📰","October Archive","A record of recent events","webPreset('October Archive')")}
        ${rowItem("🔎","Who is Alex?","Search the phone's fictional archive","webPreset('Who is Alex?')")}
        </div>`;
      break;

    case "Weather":
      html+=card(`<div class="muted">FICTIONAL LOCAL WEATHER</div>
        <h2>Tasikmalaya</h2><div class="big-number">26° ☁️</div>
        Mostly cloudy<p>Feels like 27° · Humidity 78%</p>
        <hr style="border-color:var(--line)">
        <div class="between"><span>Tue ☁️ 27°</span><span>Wed 🌦️ 25°</span><span>Thu ☀️ 29°</span></div>`);
      html+=card("Weather data is for the fictional phone experience, not a live forecast.");
      break;

    case "Calendar":
      html+=card(`<div class="between"><b>October 2026</b><span>📅</span></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;text-align:center;margin-top:20px">
        ${["S","M","T","W","T","F","S",...Array.from({length:35},(_,i)=>i<3?"":i-2)].map(d=>
          `<div style="padding:5px;border-radius:8px;${d===26?"background:var(--accent);color:#171224;font-weight:bold":""}">${d}</div>`
        ).join("")}</div>`);
      html+=card(`<b>26 October · 9:41 PM</b><p>Remember this date.</p>
        <span class="pill">Story clue</span>`);
      break;

    case "Notes":
      html+=card(`<div class="muted">MY NOTES · SAVED ON THIS DEVICE</div>
        <input id="noteTitle" class="field" style="margin-top:12px" placeholder="Note title">
        <textarea id="noteBody" placeholder="Write something..." style="margin-top:10px"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="action" onclick="saveNote()">Save note</button>
          <button class="secondary" onclick="loadClue()">Open old note</button>
        </div><div id="noteStatus" class="muted" style="margin-top:10px"></div>`);
      html+=`<div id="savedNotes"></div>`;
      break;

    case "Gallery":
      html+=`<p class="muted">ALL PHOTOS · ${photos.length} ITEMS</p>
      <div class="photo-grid">${photos.map((p,i)=>
        `<button class="photo" onclick="viewPhoto(${i})">${p}</button>`
      ).join("")}</div><div id="photoDetail"></div>`;
      break;

    case "Messages":
      html+=`<p class="muted">RECENT MESSAGES</p><div class="stack">`;
      chats.forEach((c,i)=>html+=rowItem("💬",c[0],c[1],`openChat(${i})`));
      html+=`</div>`;
      break;

    case "Music":
      html+=card(`<div style="text-align:center;padding:20px">
        <div style="font-size:85px">💿</div>
        <h2>Midnight Memories</h2><p class="muted">Mika's playlist · Fictional track</p>
        <button class="action" onclick="toggleMusic()" id="musicBtn">${musicPlaying?"⏸ Pause":"▶ Play"}</button>
        <div class="muted" style="margin-top:14px" id="musicStatus">${musicPlaying?"Playing":"Not playing"}</div>
        </div>`);
      html+=card("<b>Up next</b><p>01 · Midnight Memories</p><p>02 · October Rain</p><p>03 · Unsent Letters</p>");
      break;

    case "Contacts":
      html+=`<div class="stack">`;
      [["Mika","Best friend","🌙"],["Alex","Unknown history","🗝️"],["Mom","Family","🏠"],["Unknown","No caller ID","❔"]].forEach(c=>{
        html+=rowItem(c[2],c[0],c[1],`contactDetail('${c[0]}')`);
      });
      html+=`</div><div id="contactDetail"></div>`;
      break;

    case "Phone":
      html+=card(`<div style="text-align:center"><div class="muted">RECENT CALLS</div>
        <h3>Unknown · 11:26 PM</h3><p class="muted">Missed call</p></div>`);
      html+=card(`<label for="dialNumber">Enter a fictional number</label>
        <input id="dialNumber" class="field" placeholder="e.g. 081234567890" style="margin:10px 0">
        <button class="action" onclick="dial()">📞 Call</button>
        <p id="dialStatus" class="muted"></p>`);
      break;

    case "Settings":
      html+=card(`<b>Display</b><p class="muted">Personalize this fictional phone.</p>
        <button class="secondary" onclick="toggleTheme()">☀️ Toggle light / dark mode</button>
        <button class="secondary" onclick="changeWallpaper()" style="margin:8px 0">🎨 Change wallpaper</button>
        <p id="settingsStatus" class="muted">Appearance settings apply to this page.</p>`);
      html+=card(`<b>Device</b><p>Pocket Phone · Fictional iOS-style UI</p>
        <p class="muted">PIN clue: the story's starting date.</p>
        <p class="muted">This is a story simulator, not an actual iPhone.</p>`);
      break;

    case "Mail":
      html+=`<div class="stack">`;
      mail.forEach((m,i)=>html+=rowItem("✉️",m[0],m[1],`openMail(${i})`));
      html+=`</div><div id="mailDetail"></div>`;
      break;

    case "X":
      html+=card(`<div class="row"><div class="avatar">𝕏</div><div><b>alex.archive</b><div class="muted">@alex_archive · 2h</div></div></div>
        <p>Some things are better left in the past.</p>
        <p class="muted">26 Oct · 11:26 PM · 12 views</p>
        <button class="secondary" onclick="toast('Post liked.')">♡ Like</button>`);
      html+=card(`<b>mika.afterdark</b><p>Then why did you keep the photo?</p>
        <p class="muted">Reply · 3 likes</p>`);
      html+=card(`<textarea id="tweetText" placeholder="What's happening?"></textarea>
        <button class="action" style="margin-top:8px" onclick="postTweet()">Post</button>
        <div id="tweetStatus" class="muted"></div>`);
      break;

    case "Bank":
      html+=card(`<div class="muted">FICTIONAL BANK · DEMO ONLY</div>
        <p>Available balance</p><div class="big-number">Rp 2.450.000</div>
        <p class="muted">Demo funds · No real account</p>
        <button class="secondary" onclick="toast('Transfers are disabled in this demo.')">Transfer</button>
        <button class="secondary" onclick="toast('No real cards are linked.')">Cards</button>`);
      html+=card(`<b>Recent activity</b>
        <div class="note-line between"><span>☕ Coffee shop</span><span>− Rp 35.000</span></div>
        <div class="note-line between"><span>🛍️ Bookstore</span><span>− Rp 89.000</span></div>
        <div class="note-line between"><span>💸 Allowance</span><span>+ Rp 500.000</span></div>
        <p class="muted">All amounts and transactions are fictional.</p>`);
      break;
  }
  s.innerHTML=html;
}

function toast(message) { alert(message); }
function toggleLike() {
  liked=!liked;
  renderApp();
}
function openChat(i) {
  const c=chats[i];
  const details=[
    ["Me","Hey, are you awake?"],
    ["Mika","Still awake."],
    ["Me","What happened on the 26th?"],
    ["Mika","Check the note. You wrote it yourself."],
    ["Me","Which note?"],
    ["Mika","The one you said you'd never forget."]
  ];
  $("appScreen").innerHTML=header(c[0])+card(
    `<div class="muted">FICTIONAL CHAT · ${c[2]}</div>
    ${details.map((m,i)=>`<div style="display:flex;justify-content:${i%2?"flex-end":"flex-start"};margin:12px 0">
      <div style="background:${i%2?"#6556a3":"var(--panel2)"};padding:11px 13px;border-radius:15px;max-width:85%">${m[1]}</div></div>`).join("")}
    <form onsubmit="sendChat(event)" class="row">
      <input class="field" id="chatInput" placeholder="Message">
      <button class="action">Send</button></form>
    <div id="chatStatus" class="muted"></div>`
  );
}
function sendChat(e) {
  e.preventDefault();
  const input=$("chatInput");
  if(!input.value.trim()) return;
  $("chatStatus").textContent="Message added to this demo: "+input.value;
  input.value="";
}
function filterVideos() {
  const q=$("videoSearch").value.toLowerCase();
  $("videoList").innerHTML=videos.map((v,i)=>({v,i}))
    .filter(x=>x.v.join(" ").toLowerCase().includes(q))
    .map(x=>rowItem("▶️",x.v[0],x.v[1],`playVideo(${x.i})`)).join("")
    || "<p class='muted'>No fictional videos found.</p>";
}
function playVideo(i) {
  $("videoPlayer").innerHTML=card(`<div style="font-size:45px">▶️</div>
    <b>${videos[i][0]}</b><p class="muted">${videos[i][1]}</p>
    This video is a fictional placeholder.`);
}
function searchWeb(e) {
  e.preventDefault();
  webPreset($("webQuery").value);
}
function webPreset(q) {
  $("webResults").innerHTML=card(`<b>Search results for: ${q}</b>
    <p>POCKET ARCHIVE</p>
    <p class="muted">A fictional result saved on this phone.</p>
    <p>October 26 — The date everything changed.</p>
    <button class="action" onclick="openApp('Notes')">Check Notes</button>`);
}
function saveNote() {
  const title=$("noteTitle").value.trim()||"Untitled";
  const body=$("noteBody").value;
  try {
    const notes=JSON.parse(localStorage.getItem("pocketNotes")||"[]");
    notes.unshift({title,body});
    localStorage.setItem("pocketNotes",JSON.stringify(notes.slice(0,20)));
    $("noteStatus").textContent="Saved on this browser.";
    showNotes();
  } catch(e) {
    $("noteStatus").textContent="Couldn't save. Keep a copy of your note.";
  }
}
function showNotes() {
  let notes=[];
  try { notes=JSON.parse(localStorage.getItem("pocketNotes")||"[]"); } catch(e) {}
  const el=$("savedNotes");
  if(!el) return;
  el.innerHTML=notes.map(n=>card(`<b>${escapeHTML(n.title)}</b>
    <p class="small">${escapeHTML(n.body)}</p>`)).join("");
}
function loadClue() {
  $("noteTitle").value="October 26";
  $("noteBody").value="If you're reading this, you found the phone.\\n\\nThe last message came at 11:26 PM. Ask Alex about the photograph.\\n\\n— M";
  $("noteStatus").textContent="A saved story clue.";
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function viewPhoto(i) {
  $("photoDetail").innerHTML=card(`<div style="font-size:85px;text-align:center">${photos[i]}</div>
    <b>Photo ${i+1}</b><p class="muted">${i===5?"A small key. Where does it belong?":"Saved to the fictional gallery."}</p>`);
}
function toggleMusic() {
  musicPlaying=!musicPlaying;
  renderApp();
}
function contactDetail(name) {
  $("contactDetail").innerHTML=card(`<b>${name}</b>
    <p class="muted">Fictional contact details</p>
    <button class="action" onclick="openApp('Messages')">Message</button>
    <button class="secondary" onclick="openApp('Phone')">Call</button>`);
}
function dial() {
  const n=$("dialNumber").value.trim();
  $("dialStatus").textContent=n?"Demo only: no real call was placed.":"Enter a fictional number first.";
}
function toggleTheme() {
  lightMode=!lightMode;
  $("phone").classList.toggle("light-mode",lightMode);
  $("settingsStatus").textContent=lightMode?"Light mode enabled.":"Dark mode enabled.";
}
function changeWallpaper() {
  const backgrounds=[
    "linear-gradient(160deg,#302b51,#111321 52%,#090a10)",
    "linear-gradient(160deg,#523344,#21182e 52%,#090a10)",
    "linear-gradient(160deg,#164a4a,#182331 52%,#090a10)"
  ];
  wallpaperIndex=(wallpaperIndex+1)%backgrounds.length;
  $("home").style.background=backgrounds[wallpaperIndex];
  $("settingsStatus").textContent="Wallpaper changed.";
}
function openMail(i) {
  const m=mail[i];
  $("mailDetail").innerHTML=card(`<b>${m[0]}</b><p>${m[1]}</p>
    <p>${m[2]}</p><p class="muted">This is a fictional email.</p>
    <button class="secondary" onclick="back()">Back to phone</button>`);
}
function postTweet() {
  const text=$("tweetText").value.trim();
  $("tweetStatus").textContent=text?"Your fictional post: "+text:"Write something first.";
}

// Start with the lock screen.
drawDots();
showNotes();
</script>
</body>
</html>
